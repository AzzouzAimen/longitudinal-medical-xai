<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PDM Evidence Viewer</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <a class="skip-link" href="#view">Skip to evidence</a>
  <header class="viewer-header">
    <div class="header-grid">
    <div class="page-header">
      <div><p class="product-label">Patient Digital Memory</p><h1>PDM Evidence Viewer</h1></div>
      <div class="connection" id="status" role="status" aria-live="polite">Connecting…</div>
    </div>
    <section class="selection" aria-label="Select evidence">
      <div><label for="patient">Patient</label><select id="patient" disabled><option>Loading patients…</option></select></div>
      <div class="event-select"><label for="event">Event</label><select id="event" disabled><option>Select a patient</option></select></div>
      <button class="button secondary" id="refresh" type="button"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true" focusable="false"><use href="{{ url_for('static', filename='icons/heroicons.svg') }}#arrow-path"></use></svg>Refresh</button>
    </section>
    </div>
  </header>
  <div class="workspace">
    <div class="event-heading" id="eventHeading"><p>Choose an event to inspect its evidence.</p></div>
    <nav id="tabs" class="tabs" role="tablist" aria-label="Evidence views"></nav>
    <main id="view" role="tabpanel" tabindex="0"><div class="empty page-empty">Loading patient evidence…</div></main>
    <footer>Research prototype. Detector evidence and recorded context support review; they do not establish a diagnosis.</footer>
  </div>
  <script src="{{ url_for('static', filename='viewer-core.js') }}"></script>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
